name: tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master


jobs:
  build:

    strategy:
      max-parallel: 20
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: install pip, pytest
      run: |
        sudo apt install libxc-dev libfftw3-dev libblas-dev liblapack-dev
        python -m pip install --upgrade pip
        pip install pytest gpaw
    - name: Install GPAW 26
      env:
        CC: g++
        CXX: g++
        LDSHARED: g++ -shared
      run: pip install gpaw
    - name: Install tables from local repo, not from pypi
      working-directory: ./irreptables
      run: |
        pip install -e .
    - name: Install irrep and dependencies
      run: |
        pip install -e .
    - name: pytest
      run: |
        pytest
